<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bgGrad)"/>
  <rect width="958" height="538" x="1" y="1" rx="15" fill="none" stroke="#222f3e" stroke-width="1.5"/>

  <!-- Header -->
  <text x="480" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">COUNSELPRO HIGH-LEVEL CONCEPTUAL ARCHITECTURE</text>
  <text x="480" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" text-anchor="middle">Privacy-First Architecture for Modern Legal Practice &amp; Case Management</text>

  <!-- Tier 1: Client & Advocate Interface Layer -->
  <g filter="url(#dropShadow)">
    <rect x="50" y="95" width="860" height="75" rx="10" fill="#151d2c" stroke="#2a3b53" stroke-width="1"/>
    <rect x="50" y="95" width="6" height="75" rx="3" fill="url(#redGrad)"/>
    <text x="75" y="120" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">PRESENTATION &amp; EXPERIENCE LAYER</text>
    <text x="75" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Cross-Platform Client &amp; Advocate Mobile App</text>
    <text x="75" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Responsive Native UI • State-Driven Reactive Architecture • Offline-Tolerant Cache</text>

    <!-- Chips -->
    <rect x="550" y="117" width="105" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="602" y="136" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" text-anchor="middle">Client Shell</text>

    <rect x="665" y="117" width="115" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="722" y="136" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" text-anchor="middle">Advocate Portal</text>

    <rect x="790" y="117" width="105" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="842" y="136" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" text-anchor="middle">Admin Console</text>
  </g>

  <!-- Down Arrow 1 -->
  <path d="M 480 170 L 480 195" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="480,200 476,192 484,192" fill="#ef4444"/>

  <!-- Tier 2: Core Functional Modules -->
  <g filter="url(#dropShadow)">
    <rect x="50" y="205" width="860" height="95" rx="10" fill="#151d2c" stroke="#2a3b53" stroke-width="1"/>
    <rect x="50" y="205" width="6" height="95" rx="3" fill="#3b82f6"/>
    <text x="75" y="230" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">LEGAL WORKFLOW &amp; INTELLIGENCE MODULES</text>
    
    <!-- Sub-boxes -->
    <rect x="75" y="242" width="150" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="150" y="262" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI Legal Assistant</text>
    <text x="150" y="278" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">OCR &amp; Citation Q&amp;A</text>

    <rect x="235" y="242" width="150" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="310" y="262" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Case Lifecycle</text>
    <text x="310" y="278" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">4-Stage Matter Tracking</text>

    <rect x="395" y="242" width="150" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="470" y="262" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Advocate Matching</text>
    <text x="470" y="278" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Bar Verification &amp; Geospatial</text>

    <rect x="555" y="242" width="160" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="635" y="262" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Emergency SOS</text>
    <text x="635" y="278" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Instant On-Duty Connect</text>

    <rect x="725" y="242" width="165" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="807" y="262" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Escrow &amp; Retainer</text>
    <text x="807" y="278" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Milestone Billing &amp; Invoicing</text>
  </g>

  <!-- Down Arrow 2 -->
  <path d="M 480 300 L 480 325" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="480,330 476,322 484,322" fill="#3b82f6"/>

  <!-- Tier 3: Security & Vault Layer -->
  <g filter="url(#dropShadow)">
    <rect x="50" y="335" width="860" height="75" rx="10" fill="#151d2c" stroke="#2a3b53" stroke-width="1"/>
    <rect x="50" y="335" width="6" height="75" rx="3" fill="#10b981"/>
    <text x="75" y="360" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ZERO-TRUST SECURITY &amp; ENCRYPTION LAYER</text>
    <text x="75" y="385" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Client-Isolated Case Vaults • End-to-End Consultation Security</text>
    <text x="75" y="400" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">AES-256 Document Storage • Role-Based Scoped Access • Tamper-Evident Digital Audit Logs</text>

    <rect x="680" y="357" width="210" height="32" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="785" y="378" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Encrypted Legal Vault</text>
  </g>

  <!-- Down Arrow 3 -->
  <path d="M 480 410 L 480 435" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="480,440 476,432 484,432" fill="#10b981"/>

  <!-- Tier 4: Storage & Cloud Layer -->
  <g filter="url(#dropShadow)">
    <rect x="50" y="445" width="860" height="70" rx="10" fill="#151d2c" stroke="#2a3b53" stroke-width="1"/>
    <rect x="50" y="445" width="6" height="70" rx="3" fill="#8b5cf6"/>
    <text x="75" y="470" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">BACKEND SERVICES &amp; PERSISTENCE</text>
    <text x="75" y="495" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Microservices Architecture • Cloud Storage • Verified Identity Registry</text>
  </g>
</svg>
